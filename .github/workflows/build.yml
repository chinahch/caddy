name: Build preview packages (no automatic release)
on:
  workflow_dispatch:
    inputs:
      audit:
        description: Include opt-in destination audit (logging remains disabled by default)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          path: customization
      - uses: actions/checkout@v4
        with:
          repository: cedar2025/Xboard-Node
          ref: 0a29338e1f102a462363ce3527417029f89bab28
          path: upstream
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: upstream/go.sum
      - name: Prepare source
        env:
          AUDIT: ${{ inputs.audit }}
        run: |
          args=()
          if [ "$AUDIT" = true ]; then args+=(--audit); fi
          python3 customization/scripts/prepare_source.py --upstream upstream --out prepared "${args[@]}"
      - name: Cross compile
        run: python3 customization/scripts/build.py --source prepared --arch ${{ matrix.arch }} --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: caddy-${{ matrix.arch }}-preview
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS-*
            dist/build-info-*.json
