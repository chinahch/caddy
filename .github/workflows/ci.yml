name: Verify node source and compatibility
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        audit: [false, true]
    steps:
      - uses: actions/checkout@v4
        with:
          path: customization
      - uses: actions/checkout@v4
        with:
          repository: cedar2025/Xboard-Node
          ref: 0a29338e1f102a462363ce3527417029f89bab28
          path: upstream
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: upstream/go.sum
      - name: Python source preparation and reproducible archive tests
        working-directory: customization
        env:
          CADDY_TEST_UPSTREAM: ${{ github.workspace }}/upstream
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Installer compatibility and checksum tests (no live service)
        working-directory: customization
        run: |
          bash -n install-v2.sh
          bash tests/test-checksum.sh
          bash tests/test-installer-guards.sh
          bash tests/test-install-v2.sh
      - name: Prepare combined source
        env:
          AUDIT: ${{ matrix.audit }}
        run: |
          args=()
          if [ "$AUDIT" = true ]; then args+=(--audit); fi
          python3 customization/scripts/prepare_source.py --upstream upstream --out prepared "${args[@]}"
      - name: Test source (including optional audit on Linux)
        working-directory: prepared
        run: go test -count=1 ./internal/... ./cmd/xbctl
      - name: Build Linux amd64
        run: python3 customization/scripts/build.py --source prepared --arch amd64 --out dist
      - name: Smoke test compiled binary
        run: |
          dist/amd64/caddy -v
          dist/amd64/caddyctl version
